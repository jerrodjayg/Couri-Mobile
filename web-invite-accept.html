<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couri - Accept Invitation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            position: relative;
        }

        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #e9ecef;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #000;
            margin-bottom: 20px;
        }

        .logo .o-u {
            text-decoration: none;
            color: #000;
        }

        .invitation-text {
            font-size: 18px;
            color: #000;
            margin-bottom: 10px;
        }

        .inviter-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .inviter-name {
            font-size: 16px;
            color: #666;
        }

        .profile-pic {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #007bff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .transaction-card {
            margin: 20px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid #e9ecef;
        }

        .product-info {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .product-details {
            flex: 1;
        }

        .product-title {
            font-size: 21px;
            font-weight: 600;
            color: #000;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 500;
            color: #007bff;
            margin-bottom: 8px;
        }

        .product-description {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
        }

        .item-image {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            object-fit: cover;
        }

        .action-buttons {
            padding: 20px;
            text-align: center;
        }

        .accept-button {
            width: 100%;
            background: #000;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background-color 0.2s;
        }

        .accept-button:hover {
            background: #333;
        }

        .accept-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .decline-link {
            color: #333;
            text-decoration: underline;
            cursor: pointer;
            font-size: 16px;
        }

        .footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #FDEAFF;
            padding: 30px 20px;
            text-align: center;
            border-top: 1px solid #000;
        }

        .footer-icon {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background: white;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-weight: bold;
            font-size: 16px;
        }

        .footer-text {
            color: #000;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .loading, .error, .success {
            text-align: center;
            padding: 40px 20px;
        }

        .loading { color: #666; }
        .error { color: #dc3545; }
        .success { color: #28a745; }

        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }
            
            .transaction-card {
                margin: 15px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">cou<span class="o-u">ri</span></div>
            <div class="invitation-text">You've been invited to a transaction</div>
            <div class="inviter-info">
                <span class="inviter-name">with <span id="inviterName">Loading...</span></span>
                <div class="profile-pic" id="profilePic">?</div>
            </div>
        </div>

        <div id="content">
            <div class="loading">Loading transaction details...</div>
        </div>

        <div class="action-buttons" id="actionButtons" style="display: none;">
            <button class="accept-button" id="openAppButton" onclick="handleOpenApp()">Join transaction</button>
            <div class="decline-link" style="font-size: 14px; color: #666; margin-top: 10px;">
                Make sure you're logged in to the Couri app (TestFlight)
            </div>
        </div>

        <div class="footer">
            <div class="footer-icon">co</div>
            <div class="footer-text">SECURE PAYMENTS, SAFE PICKUP & DELIVERY</div>
        </div>
    </div>

    <script>
        // Configuration - Update these with your actual values
        const SUPABASE_PROJECT_REF = 'nfkykasruwdzpcjuufdu'; // Your Supabase project ref
        const SUPABASE_URL = `https://${SUPABASE_PROJECT_REF}.supabase.co`;
        const FUNCTION_URL = `https://${SUPABASE_PROJECT_REF}.functions.supabase.co/accept-invite-by-id`;
        const DEEP_LINK_SCHEME = 'com.anonymous.jerrod'; // Your app deep link scheme
        
        let transactionData = null;

        // Get transaction ID from URL
        function getTransactionId() {
            const urlParams = new URLSearchParams(window.location.search);
            const transactionId = urlParams.get('id') || urlParams.get('transactionId');
            
            // Also check if it's in the path like /invite/abc123
            if (!transactionId) {
                const path = window.location.pathname;
                const match = path.match(/\/invite\/([^\/]+)/);
                return match ? match[1] : null;
            }
            
            return transactionId;
        }

        // Load transaction data
        async function loadTransaction() {
            try {
                const transactionId = getTransactionId();
                
                if (!transactionId) {
                    showError('Invalid transaction link');
                    return;
                }

                // Fetch transaction data from Supabase Edge Function
                const response = await fetch(`${FUNCTION_URL}?transactionId=${transactionId}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Transaction not found');
                }

                const result = await response.json();
                transactionData = result.transaction;

                displayTransaction();
                
            } catch (error) {
                console.error('Error loading transaction:', error);
                showError('Failed to load transaction. Please try again.');
            }
        }

        // Display transaction data
        function displayTransaction() {
            const content = document.getElementById('content');
            const actionButtons = document.getElementById('actionButtons');
            
            // Update inviter info
            const inviterName = transactionData.inviter?.name || 'Unknown User';
            document.getElementById('inviterName').textContent = inviterName;
            const profilePic = document.getElementById('profilePic');
            profilePic.textContent = inviterName.charAt(0).toUpperCase();

            // Get transaction details from metadata
            const metadata = transactionData.metadata || {};
            const title = metadata.item_title || 'Product';
            const price = metadata.amount || metadata.price || '0';
            const description = metadata.item_description || '';
            const image = metadata.item_image || '';

            // Create transaction card HTML
            const transactionCard = `
                <div class="transaction-card">
                    <div class="product-info">
                        <div class="product-details">
                            <div class="product-title">"${title}"</div>
                            <div class="product-price">$${price}</div>
                            ${description ? `<div class="product-description">${description}</div>` : ''}
                        </div>
                        ${image ? `<img src="${image}" alt="Product" class="item-image" onerror="this.style.display='none'">` : `<div class="item-image"></div>`}
                    </div>
                </div>
            `;

            content.innerHTML = transactionCard;
            actionButtons.style.display = 'block';
        }

        // Handle opening the app
        async function handleOpenApp() {
            const button = document.getElementById('openAppButton');
            button.disabled = true;
            button.textContent = 'Opening app...';

            try {
                const transactionId = getTransactionId();
                
                console.log('Opening Couri app (TestFlight) with transaction ID:', transactionId);
                
                // Use Universal Link format for TestFlight
                // Format: https://gocouri.com/deeplink/i/:token
                const universalLinkUrl = `https://gocouri.com/deeplink/i/${transactionId}`;
                
                console.log('🔗 Opening via Universal Link:', universalLinkUrl);
                
                // Attempt to open the universal link
                const startTime = Date.now();
                window.location.href = universalLinkUrl;
                
                // Show instructions message
                showSuccess(`Opening Couri app...<br><br>If you're already logged in to the TestFlight app, you should see the invitation on your Welcome screen.<br><br>Invite ID: <strong>${transactionId}</strong>`);
                
                // After a short delay, if the page is still visible, show TestFlight option
                setTimeout(() => {
                    // Check if user is still on the page (deep link didn't work)
                    if (!document.hidden && (Date.now() - startTime) > 2000) {
                        const content = document.getElementById('content');
                        content.innerHTML = `
                            <div class="success">
                                <h2>📱</h2>
                                <p style="margin-bottom: 20px;">App didn't open automatically?</p>
                                <p style="margin-bottom: 20px;">
                                    <strong>Transaction ID:</strong><br>
                                    <span style="font-size: 14px; background: #f0f0f0; padding: 8px; border-radius: 4px; display: inline-block; margin-top: 8px;">${transactionId}</span>
                                </p>
                                <p style="margin-bottom: 20px; font-size: 14px;">Open the <strong>Couri</strong> app in TestFlight and look for this invitation on your Welcome screen.</p>
                                <a href="https://testflight.apple.com/join/QhI2bnLy" 
                                   style="display: inline-block; background: #000; color: white; padding: 12px 24px; border-radius: 25px; text-decoration: none; font-weight: 600; margin-top: 10px;">
                                    Open TestFlight
                                </a>
                            </div>
                        `;
                    }
                }, 2500);

            } catch (error) {
                console.error('Error opening app:', error);
                button.disabled = false;
                button.textContent = 'Join transaction';
                showError('Failed to open app. Please try again.');
            }
        }

        // Show success message
        function showSuccess(message) {
            document.getElementById('content').innerHTML = `
                <div class="success">
                    <h2>✓</h2>
                    <p>${message}</p>
                </div>
            `;
            document.getElementById('actionButtons').style.display = 'none';
        }

        // Show error message
        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <h2>⚠</h2>
                    <p>${message}</p>
                </div>
            `;
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', loadTransaction);
    </script>
</body>
</html>
