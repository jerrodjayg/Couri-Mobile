<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couri - Transaction Accepted</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            position: relative;
        }

        .content {
            padding: 40px 20px;
            text-align: center;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }

        .success-text {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .app-title {
            font-size: 24px;
            font-weight: bold;
            color: #000;
            margin-bottom: 15px;
        }

        .app-description {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .action-buttons {
            margin-bottom: 30px;
        }

        .open-app-button {
            width: 100%;
            background: #333;
            color: white;
            border: 1px solid #333;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .open-app-button:hover {
            background: #555;
            border-color: #555;
        }

        .download-section {
            margin-top: 20px;
        }

        .download-text {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .app-store-button {
            width: 100%;
            background: #000;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .app-store-button:hover {
            background: #333;
        }

        .apple-icon {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #000;
        }

        .footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            padding: 30px 20px;
            text-align: center;
        }

        .footer-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-weight: bold;
            font-size: 14px;
        }

        .footer-text {
            color: #333;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .error {
            text-align: center;
            padding: 40px 20px;
            color: #dc3545;
        }

        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }
            
            .content {
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="success-icon">✓</div>
            <div class="success-text">Transaction accepted!</div>
            
            <div class="app-title">Continue in the Couri app</div>
            <div class="app-description">
                The Couri app brings you secure payments and hassle-free pickup & delivery.
            </div>

            <div class="action-buttons">
                <button class="open-app-button" onclick="openInApp()">Open in the Couri app</button>
                
                <div class="download-section">
                    <div class="download-text">Don't have the app yet?</div>
                    <button class="app-store-button" onclick="downloadApp()">
                        <div class="apple-icon">🍎</div>
                        Download on the App Store
                    </button>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="footer-icon">co</div>
            <div class="footer-text">SECURE PAYMENTS, SAFE PICKUP & DELIVERY</div>
        </div>
    </div>

    <script>
        // Supabase configuration
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        let transactionData = null;

        // Initialize Supabase client
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Get transaction ID from URL
        function getTransactionId() {
            const path = window.location.pathname;
            const segments = path.split('/');
            return segments[segments.length - 1];
        }

        // Load transaction data
        async function loadTransaction() {
            try {
                const transactionId = getTransactionId();
                
                if (!transactionId) {
                    showError('Invalid transaction link');
                    return;
                }

                // Fetch transaction data from Supabase
                const { data: transaction, error: transactionError } = await supabaseClient
                    .from('transactions')
                    .select('*')
                    .eq('id', transactionId)
                    .single();

                if (transactionError) {
                    console.error('Error fetching transaction:', transactionError);
                    showError('Transaction not found');
                    return;
                }

                transactionData = transaction;
                
            } catch (error) {
                console.error('Error loading transaction:', error);
                showError('Failed to load transaction');
            }
        }

        // Open app with deep link
        function openInApp() {
            if (!transactionData) {
                downloadApp();
                return;
            }

            // Check if app is installed
            if (isAppInstalled()) {
                // Try to open app with deep link
                const deepLinkUrl = `couri://transaction/${transactionData.id}`;
                window.location.href = deepLinkUrl;
                
                // Fallback to app store after a delay
                setTimeout(() => {
                    downloadApp();
                }, 2000);
            } else {
                // Direct to app store
                downloadApp();
            }
        }

        // Download app from App Store
        function downloadApp() {
            window.location.href = 'https://apps.apple.com/app/couri/id1234567890';
        }

        // Check if app is installed (iOS detection)
        function isAppInstalled() {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            return isIOS;
        }

        // Show error message
        function showError(message) {
            document.querySelector('.content').innerHTML = `
                <div class="error">${message}</div>
            `;
        }

        // Load Supabase script and initialize
        function loadSupabase() {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
            script.onload = () => {
                loadTransaction();
            };
            script.onerror = () => {
                showError('Failed to load required scripts');
            };
            document.head.appendChild(script);
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', loadSupabase);
    </script>
</body>
</html>
