<!DOCTYPE html>
<!-- 
  STANDALONE HTML FILE - Can be hosted on any web server
  No Squarespace dependencies - works independently
  Upload this file to your web server and access via: yourdomain.com/web-accepted.html?id=TRANSACTION_ID
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couri - Transaction Accepted</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #fff;
            color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .content {
            flex: 1;
            padding: 60px 20px 180px;
            text-align: center;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #10B981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 40px;
            font-weight: bold;
        }

        .success-text {
            font-size: 16px;
            color: #666;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .app-title {
            font-size: 28px;
            font-weight: 700;
            color: #000;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .app-description {
            font-size: 16px;
            color: #000;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .action-buttons {
            margin-bottom: 30px;
        }

        .open-app-button {
            width: 100%;
            max-width: 300px;
            background: #111;
            color: white;
            border: none;
            padding: 16px 18px;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin: 0 auto 30px;
            display: block;
            box-shadow: 0 6px 12px rgba(0,0,0,.18);
            transition: background 0.2s;
        }

        .open-app-button:hover {
            background: #000;
        }

        .open-app-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .download-section {
            margin-top: 20px;
        }

        .download-text {
            font-size: 15px;
            color: #666;
            margin-bottom: 15px;
        }

        .app-store-button {
            width: 100%;
            max-width: 300px;
            background: #000;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 26px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0 auto;
            transition: background 0.2s;
        }

        .app-store-button:hover {
            background: #333;
        }

        .apple-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, #eef3ff, #e6ebf7);
            padding: 20px 40px 16px;
            z-index: 10;
        }

        .safety {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .badge {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #fff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 3px 8px rgba(0,0,0,.06);
        }

        .badge img {
            width: 60%;
            height: 60%;
            object-fit: contain;
        }

        .tag {
            font-size: 12.4px;
            letter-spacing: .3px;
            color: #111;
            font-weight: 500;
            text-transform: uppercase;
        }

        @media (max-width: 414px) {
            .content {
                padding: 50px 16px 170px;
            }

            .footer {
                padding: 20px 30px 16px;
            }

            .app-title {
                font-size: 26px;
            }

            .open-app-button,
            .app-store-button {
                max-width: 280px;
            }
        }

        @media (max-width: 375px) {
            .content {
                padding: 45px 14px 165px;
            }

            .footer {
                padding: 20px 25px 16px;
            }

            .app-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="success-icon">✓</div>
            <div class="success-text">Transaction accepted!</div>
            
            <div class="app-title">Continue in the Couri app</div>
            <div class="app-description">
                The Couri app brings you secure payments and hassle-free pickup & delivery.
            </div>

            <div class="action-buttons">
                <button class="open-app-button" id="open-app-btn" onclick="openInApp()">Add Product Info in the Couri app</button>
                
                <div class="download-section">
                    <div class="download-text">Don't have the app yet?</div>
                    <button class="app-store-button" onclick="downloadApp()">
                        <span class="apple-icon">🍎</span>
                        <span>Download on the App Store</span>
                    </button>
                </div>
            </div>
        </div>

        <footer class="footer">
            <div class="safety">
                <div class="badge">
                    <img src="https://nfkykasruwdzpcjuufdu.supabase.co/storage/v1/object/public/app-icons/Mark%202%20Dark.png" alt="Couri Logo" />
                </div>
                <div class="tag">SECURE PAYMENTS, SAFE PICKUP & DELIVERY</div>
            </div>
        </footer>
    </div>

    <script>
        const CONFIG = {
            APP_STORE_URL: 'https://apps.apple.com/app/couri/id6736088504'
        };

        // Get transaction ID from URL
        function getTransactionId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id') || urlParams.get('transaction_id') || urlParams.get('t');
        }

        // Open app with deep link or fallback to App Store
        function openInApp() {
            const btn = document.getElementById('open-app-btn');
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Opening...';
            }

            const transactionId = getTransactionId();
            const deepLinkUrl = `couri://transaction/${transactionId || ''}`;
            
            // Try to open the app with deep link
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = deepLinkUrl;
            document.body.appendChild(iframe);

            // Clean up iframe after a short delay
            setTimeout(() => {
                if (document.body.contains(iframe)) {
                    document.body.removeChild(iframe);
                }
            }, 1000);

            // Fallback to App Store after delay (if app doesn't open)
            setTimeout(() => {
                window.location.href = CONFIG.APP_STORE_URL;
            }, 1500);
        }

        // Download app from App Store
        function downloadApp() {
            window.location.href = CONFIG.APP_STORE_URL;
        }
    </script>
</body>
</html>
