<script>
  (function() {
    const CONFIG = {
      SUPABASE_URL: 'https://nfkykasruwdzpcjuufdu.supabase.co',
      SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ma3lrYXNydXdkenBjanV1ZmR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTAxOTU5OTcsImV4cCI6MjA2NTc3MTk5N30._-SBo_yqk0ABeXNHYGsKjBn2HwrFP-QCjCkJn2KqtOw',
      APP_STORE_URL: 'https://apps.apple.com/app/couri/id6736088504'
    };
    
    let transactionData = null;
    let supabaseClient = null;

    function getTransactionId() {
      const urlParams = new URLSearchParams(window.location.search);
      const transactionId = urlParams.get('id') || urlParams.get('transaction_id') || urlParams.get('t');
      return transactionId;
    }

    async function loadTransaction() {
      try {
        const transactionId = getTransactionId();
        
        if (!transactionId) {
          document.querySelector('.couri-hero h1').textContent = 'Invalid Link';
          document.querySelector('.couri-sub').textContent = 'Please check your invitation link and try again.';
          document.querySelector('.couri-card').style.display = 'none';
          document.querySelector('.couri-source').style.display = 'none';
          document.querySelector('.couri-btn').style.display = 'none';
          document.querySelector('.couri-decline').style.display = 'none';
          return;
        }

        const { data: transactions, error } = await supabaseClient
          .from('transactions')
          .select('*')
          .eq('id', transactionId);

        if (error) {
          console.error('Error:', error);
          showLoadingError();
          return;
        }

        if (!transactions || transactions.length === 0) {
          showLoadingError();
          return;
        }

        const transaction = transactions[0];
        
        transactionData = {
          ...transaction,
          item_title: transaction.metadata?.item_title || transaction.metadata?.title || 'Untitled Item',
          item_image: transaction.metadata?.item_image || transaction.metadata?.image || null,
          source: transaction.metadata?.source || 'Facebook Marketplace'
        };
        
        const inviterName = transaction.metadata?.inviter_name || 
                           transaction.metadata?.userAddress?.full_name || 
                           transaction.metadata?.userAddress?.name || 
                           'User';

        displayTransaction(inviterName);
        
      } catch (error) {
        console.error('Error:', error);
        showLoadingError();
      }
    }

    function displayTransaction(inviterName) {
      if (!transactionData) return;

      document.querySelector('.couri-inviter-name').textContent = inviterName;
      document.querySelector('.couri-avatar-initial').textContent = inviterName.charAt(0).toUpperCase();
      
      const titleEl = document.getElementById('couri-item-title');
      if (titleEl) {
        titleEl.textContent = `"${transactionData.item_title}"`;
      }
      
      const thumbImg = document.getElementById('couri-item-image');
      if (thumbImg && transactionData.item_image) {
        thumbImg.src = transactionData.item_image;
        thumbImg.style.display = 'block';
        thumbImg.onerror = function() {
          this.style.display = 'none';
        };
      }

      const sourceText = document.querySelector('.couri-source-text');
      if (sourceText) {
        sourceText.textContent = `from ${transactionData.source}`;
      }
    }

    function showLoadingError() {
      document.querySelector('.couri-hero h1').textContent = 'Unable to Load';
      document.querySelector('.couri-sub').textContent = 'The invitation link may be invalid or expired.';
      document.querySelector('.couri-card').style.display = 'none';
      document.querySelector('.couri-source').style.display = 'none';
      document.querySelector('.couri-btn').style.display = 'none';
      document.querySelector('.couri-decline').style.display = 'none';
    }

    window.couriHandleJoinTransaction = function() {
      try {
        const joinBtn = document.getElementById('couri-join-btn');
        if (joinBtn) {
          joinBtn.disabled = true;
          joinBtn.textContent = 'Processing...';
        }
        
        const transactionId = getTransactionId();
        console.log('Join Transaction - transactionId:', transactionId);
        
        // Update transaction status (fire and forget)
        if (transactionId && supabaseClient) {
          supabaseClient
            .from('transactions')
            .update({ status: 'accepted', updated_at: new Date().toISOString() })
            .eq('id', transactionId)
            .catch(err => console.error('Update error:', err));
        }
        
        // Redirect immediately - use absolute URL for Squarespace
        const baseUrl = window.location.origin;
        const successUrl = `${baseUrl}/continue1?id=${transactionId || ''}`;
        console.log('Redirecting to:', successUrl);
        
        // Force redirect - try multiple methods
        setTimeout(() => {
          try {
            window.location.replace(successUrl);
          } catch (e) {
            window.location.href = successUrl;
          }
        }, 50);
      } catch (error) {
        console.error('Error in couriHandleJoinTransaction:', error);
        // Fallback redirect
        const transactionId = getTransactionId();
        window.location.href = `/continue1?id=${transactionId || ''}`;
      }
    };

    window.couriHandleDecline = function() {
      const transactionId = getTransactionId();
      if (transactionId && supabaseClient) {
        supabaseClient
          .from('transactions')
          .update({ status: 'declined', updated_at: new Date().toISOString() })
          .eq('id', transactionId)
          .catch(err => console.error('Update error:', err));
      }
      
      document.querySelector('.couri-hero h1').textContent = 'Transaction Declined';
      document.querySelector('.couri-sub').textContent = 'This transaction is closed.';
      document.querySelector('.couri-card').style.display = 'none';
      document.querySelector('.couri-source').style.display = 'none';
      document.querySelector('.couri-btn').style.display = 'none';
      document.querySelector('.couri-decline').style.display = 'none';
    };

    function init() {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      script.onload = () => {
        supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        loadTransaction();
      };
      script.onerror = () => {
        showLoadingError();
      };
      document.head.appendChild(script);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
