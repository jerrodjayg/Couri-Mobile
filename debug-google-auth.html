<!DOCTYPE html>
<html>
<head>
    <title>Google Auth Debug Test</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Google Auth Debug Test</h1>
    <button id="testBtn">Test Google Sign-in</button>
    <div id="output"></div>

    <script>
        // Use your actual Supabase URL and anon key
        const supabaseUrl = 'https://nfkykasruwdzpcjuufdu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ma3lrYXNydXdkenBjanV1ZmR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzI5Nzg2NjEsImV4cCI6MjA0ODU1NDY2MX0.KbH2z1xV1lQJ7vK8Q9Y5rF3nM6pL4sT7uW2eR5iO8c';
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        const output = document.getElementById('output');
        
        function log(message) {
            console.log(message);
            output.innerHTML += '<div>' + message + '</div>';
        }
        
        document.getElementById('testBtn').addEventListener('click', async () => {
            log('🔄 Starting Google OAuth test...');
            
            try {
                const redirectTo = window.location.origin;
                log('🔗 Redirect URL: ' + redirectTo);
                
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: redirectTo,
                        queryParams: {
                            access_type: 'offline',
                            prompt: 'consent',
                        },
                    },
                });
                
                if (error) {
                    log('❌ OAuth Error: ' + error.message);
                    return;
                }
                
                if (!data?.url) {
                    log('❌ No OAuth URL received');
                    return;
                }
                
                log('✅ OAuth URL received: ' + data.url);
                log('🌐 Opening in new tab...');
                
                const newWindow = window.open(data.url, '_blank');
                if (newWindow) {
                    log('✅ New tab opened successfully');
                } else {
                    log('❌ Failed to open new tab (popup blocked?)');
                }
                
            } catch (err) {
                log('❌ Exception: ' + err.message);
            }
        });
    </script>
</body>
</html>
