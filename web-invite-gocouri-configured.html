<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couri - Transaction Invitation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            position: relative;
        }

        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #e9ecef;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #000;
            margin-bottom: 20px;
        }

        .logo .o-u {
            text-decoration: none;
            color: #000;
        }

        .invitation-text {
            font-size: 18px;
            color: #000;
            margin-bottom: 10px;
        }

        .inviter-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .inviter-name {
            font-size: 16px;
            color: #666;
        }

        .profile-pic {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #007bff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .transaction-card {
            margin: 20px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid #e9ecef;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 10px;
        }

        .item-description {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .item-image {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            float: right;
            margin-left: 15px;
            object-fit: cover;
        }

        .source {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }

        .facebook-logo {
            width: 16px;
            height: 16px;
            background: #1877f2;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: bold;
        }

        .action-buttons {
            padding: 20px;
            text-align: center;
        }

        .join-button {
            width: 100%;
            background: #333;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background-color 0.2s;
        }

        .join-button:hover {
            background: #555;
        }

        .decline-link {
            color: #333;
            text-decoration: underline;
            cursor: pointer;
            font-size: 16px;
        }

        .footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            padding: 30px 20px;
            text-align: center;
        }

        .footer-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-weight: bold;
            font-size: 14px;
        }

        .footer-text {
            color: #333;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .error {
            text-align: center;
            padding: 40px 20px;
            color: #dc3545;
        }

        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }
            
            .transaction-card {
                margin: 15px;
                padding: 15px;
            }
            
            .item-image {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">cou<span class="o-u">ri</span></div>
            <div class="invitation-text">You've been invited to a transaction</div>
            <div class="inviter-info">
                <span class="inviter-name">with <span id="inviterName">Loading...</span></span>
                <div class="profile-pic" id="profilePic">?</div>
            </div>
        </div>

        <div id="content">
            <div class="loading">Loading transaction details...</div>
        </div>

        <div class="action-buttons" id="actionButtons" style="display: none;">
            <button class="join-button" onclick="handleJoinTransaction()">Join Transaction</button>
            <div class="decline-link" onclick="handleDecline()">Decline</div>
        </div>

        <div class="footer">
            <div class="footer-icon">co</div>
            <div class="footer-text">SECURE PAYMENTS, SAFE PICKUP & DELIVERY</div>
        </div>
    </div>

    <script>
        // ✅ Configuration with your actual credentials
        const CONFIG = {
            SUPABASE_URL: 'https://nfkykasruwdzpcjuufdu.supabase.co',
            SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ma3lrYXNydXdkenBjanV1ZmR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTAxOTU5OTcsImV4cCI6MjA2NTc3MTk5N30._-SBo_yqk0ABeXNHYGsKjBn2HwrFP-QCjCkJn2KqtOw',
            APP_STORE_URL: 'https://apps.apple.com/app/couri/id1234567890', // ⚠️ Replace with your actual App Store URL when you publish
            DOMAIN: 'gocouri.com'
        };
        
        let transactionData = null;
        let inviterData = null;

        // Initialize Supabase client
        const { createClient } = supabase;
        const supabaseClient = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

        // Get transaction ID from URL path
        function getTransactionId() {
            const path = window.location.pathname;
            const segments = path.split('/').filter(segment => segment);
            
            // Handle gocouri.com/invite/[transaction-id]
            if (segments.length >= 2 && segments[0] === 'invite') {
                return segments[segments.length - 1];
            }
            
            // Fallback to query parameter
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id') || urlParams.get('transaction_id');
        }

        // Load transaction data
        async function loadTransaction() {
            try {
                const transactionId = getTransactionId();
                
                if (!transactionId) {
                    showError('Invalid transaction link');
                    return;
                }

                console.log('Loading transaction:', transactionId);

                // Fetch transaction data from Supabase
                const { data: transaction, error: transactionError } = await supabaseClient
                    .from('transactions')
                    .select(`
                        *,
                        inviter:auth.users!transactions_inviter_id_fkey(*)
                    `)
                    .eq('id', transactionId)
                    .single();

                if (transactionError) {
                    console.error('Error fetching transaction:', transactionError);
                    showError('Transaction not found');
                    return;
                }

                // Extract data from metadata (temporary solution)
                transactionData = {
                    ...transaction,
                    amount: transaction.metadata?.amount || 0,
                    item_title: transaction.metadata?.item_title || 'Untitled Item',
                    item_description: transaction.metadata?.item_description || '',
                    item_image: transaction.metadata?.item_image || null,
                    source: transaction.metadata?.source || 'Facebook Marketplace',
                    expires_at: transaction.metadata?.expires_at || new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString()
                };
                
                inviterData = transaction.inviter;

                displayTransaction();
                
            } catch (error) {
                console.error('Error loading transaction:', error);
                showError('Failed to load transaction');
            }
        }

        // Display transaction data
        function displayTransaction() {
            const content = document.getElementById('content');
            const actionButtons = document.getElementById('actionButtons');
            
            // Update inviter info
            document.getElementById('inviterName').textContent = inviterData?.full_name || inviterData?.user_metadata?.full_name || 'Unknown User';
            const profilePic = document.getElementById('profilePic');
            if (inviterData?.full_name || inviterData?.user_metadata?.full_name) {
                const name = inviterData?.full_name || inviterData?.user_metadata?.full_name;
                profilePic.textContent = name.charAt(0).toUpperCase();
            }

            // Create transaction card HTML
            const transactionCard = `
                <div class="transaction-card">
                    <div class="price">$${transactionData.amount || '0'}</div>
                    <div class="item-description">
                        "${transactionData.item_title || 'Untitled Item'}" 
                        ${transactionData.item_description ? `by ${transactionData.item_description}` : ''}
                    </div>
                    ${transactionData.item_image ? `<img src="${transactionData.item_image}" alt="Item" class="item-image" onerror="this.style.display='none'">` : ''}
                    <div class="source">
                        <div class="facebook-logo">f</div>
                        <span>from Facebook Marketplace</span>
                    </div>
                </div>
            `;

            content.innerHTML = transactionCard;
            actionButtons.style.display = 'block';
        }

        // Handle join transaction
        function handleJoinTransaction() {
            // Check if app is installed
            if (isAppInstalled()) {
                // Try to open app with deep link
                const deepLinkUrl = `couri://transaction/${transactionData.id}`;
                window.location.href = deepLinkUrl;
                
                // Fallback to app store after a delay
                setTimeout(() => {
                    window.location.href = CONFIG.APP_STORE_URL;
                }, 2000);
            } else {
                // Direct to app store
                window.location.href = CONFIG.APP_STORE_URL;
            }
        }

        // Handle decline
        function handleDecline() {
            // Update transaction status in database
            updateTransactionStatus('declined');
            
            // Show declined page
            showDeclinedPage();
        }

        // Check if app is installed (iOS detection)
        function isAppInstalled() {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            return isIOS;
        }

        // Update transaction status
        async function updateTransactionStatus(status) {
            try {
                const { error } = await supabaseClient
                    .from('transactions')
                    .update({ 
                        status: status,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', transactionData.id);

                if (error) {
                    console.error('Error updating transaction status:', error);
                }
            } catch (error) {
                console.error('Error updating transaction:', error);
            }
        }

        // Show declined page
        function showDeclinedPage() {
            document.body.innerHTML = `
                <div class="container">
                    <div class="header">
                        <div class="logo">cou<span class="o-u">ri</span></div>
                        <div class="invitation-text">You've declined this transaction</div>
                        <div style="color: #666; font-size: 14px; margin-top: 10px;">
                            This transaction is closed. You'll be able to join future requests anytime!
                        </div>
                    </div>
                    
                    <div class="transaction-card" style="margin: 20px;">
                        <div class="price">$${transactionData.amount || '0'}</div>
                        <div class="item-description">
                            "${transactionData.item_title || 'Untitled Item'}" 
                            ${transactionData.item_description ? `by ${transactionData.item_description}` : ''}
                        </div>
                        ${transactionData.item_image ? `<img src="${transactionData.item_image}" alt="Item" class="item-image" onerror="this.style.display='none'">` : ''}
                        <div class="source">
                            <div class="facebook-logo">f</div>
                            <span>from Facebook Marketplace</span>
                        </div>
                    </div>

                    <div class="footer">
                        <div class="footer-icon">co</div>
                        <div class="footer-text">SECURE PAYMENTS, SAFE PICKUP & DELIVERY</div>
                    </div>
                </div>
            `;
        }

        // Show error message
        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="error">${message}</div>
            `;
        }

        // Load Supabase script and initialize
        function loadSupabase() {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
            script.onload = () => {
                loadTransaction();
            };
            script.onerror = () => {
                showError('Failed to load required scripts');
            };
            document.head.appendChild(script);
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', loadSupabase);
    </script>
</body>
</html>
