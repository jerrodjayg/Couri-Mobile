<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Auth Test - Couri</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #000;
            margin-bottom: 20px;
            text-align: center;
        }
        .button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            width: 100%;
        }
        .button:hover {
            background: #0056b3;
        }
        .debug {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 14px;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">cou<span style="text-decoration: none; color: #000;">ri</span></div>
        <h2>Web Authentication Test</h2>
        
        <button class="button" onclick="testAuth()">Test Google Sign-in</button>
        <button class="button" onclick="testSupabase()">Test Supabase Connection</button>
        <button class="button" onclick="clearDebug()">Clear Debug Info</button>
        
        <div id="debug" class="debug">
            <strong>Debug Information:</strong><br>
            <span id="debug-content">Click a button to test...</span>
        </div>
    </div>

    <script>
        // Supabase configuration - you'll need to replace these with your actual values
        const SUPABASE_URL = 'https://nfkykasruwdzpcjuufdu.supabase.co';
        const SUPABASE_ANON_KEY = 'your_supabase_anon_key_here'; // Replace with your actual key
        
        let debugDiv = document.getElementById('debug');
        let debugContent = document.getElementById('debug-content');
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `[${timestamp}] ${message}`;
            console.log(logMessage);
            
            debugContent.innerHTML += `<br>${logMessage}`;
            debugDiv.scrollTop = debugDiv.scrollHeight;
            
            if (type === 'error') {
                debugDiv.className = 'debug error';
            } else if (type === 'success') {
                debugDiv.className = 'debug success';
            } else {
                debugDiv.className = 'debug';
            }
        }
        
        function clearDebug() {
            debugContent.innerHTML = 'Debug information cleared.';
            debugDiv.className = 'debug';
        }
        
        async function testSupabase() {
            try {
                log('Testing Supabase connection...');
                
                // Load Supabase client
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
                
                script.onload = async () => {
                    try {
                        const { createClient } = supabase;
                        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                        
                        log('Supabase client created successfully');
                        
                        // Test connection
                        const { data, error } = await supabaseClient.auth.getSession();
                        
                        if (error) {
                            log(`Supabase error: ${error.message}`, 'error');
                        } else {
                            log('Supabase connection successful', 'success');
                            log(`Current session: ${data.session ? 'Authenticated' : 'Not authenticated'}`);
                        }
                    } catch (err) {
                        log(`Supabase test failed: ${err.message}`, 'error');
                    }
                };
                
                script.onerror = () => {
                    log('Failed to load Supabase library', 'error');
                };
                
                document.head.appendChild(script);
                
            } catch (err) {
                log(`Test failed: ${err.message}`, 'error');
            }
        }
        
        async function testAuth() {
            try {
                log('Testing Google authentication...');
                log(`Current URL: ${window.location.href}`);
                log(`Origin: ${window.location.origin}`);
                
                // Test redirect URL construction
                const redirectUrl = `${window.location.origin}/auth/callback`;
                log(`Redirect URL would be: ${redirectUrl}`);
                
                // Check if we're on the callback page
                if (window.location.pathname.includes('/auth/callback')) {
                    log('Currently on auth callback page');
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    const code = urlParams.get('code');
                    const error = urlParams.get('error');
                    
                    if (code) {
                        log(`Authorization code received: ${code.substring(0, 20)}...`, 'success');
                    } else if (error) {
                        log(`OAuth error: ${error}`, 'error');
                    } else {
                        log('No code or error found in URL', 'error');
                    }
                } else {
                    log('Not on callback page - would redirect to Google OAuth');
                    log('To test actual OAuth, you need to configure Supabase and Google OAuth settings');
                }
                
            } catch (err) {
                log(`Auth test failed: ${err.message}`, 'error');
            }
        }
        
        // Auto-run basic tests when page loads
        window.addEventListener('load', () => {
            log('Page loaded - ready for testing');
            log(`Platform: Web Browser`);
            log(`URL: ${window.location.href}`);
        });
    </script>
</body>
</html>
