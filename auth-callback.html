<!DOCTYPE html>
<!-- 
  STANDALONE HTML FILE - Can be hosted on any web server
  No Squarespace dependencies - works independently
  Upload this file to your web server and access via: yourdomain.com/invite.html?id=TRANSACTION_ID
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Couri – Invite</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #000;
      background: #fff;
      overflow-x: hidden;
    }
    
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .preview {
      width: 100%;
      min-height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
    }
    
    main {
      flex: 1;
      padding: 40px 20px 140px;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      justify-content: center;
      margin-top: 8px;
      margin-bottom: 20px;
    }
    
    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #000;
      letter-spacing: -0.5px;
    }

    .hero {
      margin: 10px 14px 24px;
      text-align: center;
    }
    
    .hero h1 {
      font-size: 28px;
      line-height: 1.2;
      margin: 6px 0 8px;
      font-weight: 700;
      color: #000;
    }
    
    .sub {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      color: #4b5563;
      font-size: 15px;
      margin-top: 12px;
    }
    
    .avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #cdd7eb;
    }
    
    .avatar span {
      font-size: 11px;
      font-weight: 700;
      color: #1f2937;
    }

    .card {
      margin: 16px auto 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 12px 12px 12px 14px;
      gap: 12px;
      max-width: 100%;
      background: #fff;
    }
    
    .item-info {
      flex: 1 1 auto;
      min-width: 0;
    }
    
    .title {
      font-size: 14.5px;
      line-height: 1.25;
      color: #111;
      margin: 0;
      word-wrap: break-word;
    }
    
    .thumb {
      flex: 0 0 82px;
      width: 82px;
      height: 82px;
      border-radius: 8px;
      background: #e6e6e6;
      overflow: hidden;
      flex-shrink: 0;
    }
    
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .source {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      color: #4b5563;
      font-size: 13px;
      margin: 6px 0 20px;
    }
    
    .fb {
      width: 16px;
      height: 16px;
      display: inline-block;
      flex-shrink: 0;
    }
    
    .fb svg {
      display: block;
    }

    .btn {
      display: block;
      width: calc(100% - 40px);
      max-width: 300px;
      margin: 0 auto 12px;
      padding: 16px 18px;
      border-radius: 26px;
      text-align: center;
      font-weight: 700;
      border: 0;
      cursor: pointer;
      font-size: 16px;
      background: #111;
      color: #fff;
      box-shadow: 0 6px 12px rgba(0,0,0,.18);
    }
    
    .btn:hover {
      background: #000;
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .decline {
      display: block;
      text-align: center;
      color: #111;
      text-decoration: underline;
      font-size: 15px;
      margin-top: 2px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, #eef3ff, #e6ebf7);
      padding: 20px 40px 16px;
      z-index: 10;
    }
    
    .safety {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    
    .badge {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 3px 8px rgba(0,0,0,.06);
    }
    
    .badge img {
      width: 60%;
      height: 60%;
      object-fit: contain;
    }
    
    .tag {
      font-size: 12.4px;
      letter-spacing: .3px;
      color: #111;
      font-weight: 500;
      text-transform: uppercase;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #666;
      font-size: 15px;
    }

    @media (max-width: 414px) {
      main {
        padding: 30px 16px 130px;
      }
      
      .footer {
        padding: 20px 30px 16px;
      }
      
      .hero h1 {
        font-size: 26px;
      }
      
      .logo {
        font-size: 28px;
      }
      
      .card {
        padding: 14px;
      }
      
      .btn {
        width: calc(100% - 32px);
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="preview">
    <main>
      <div class="brand">
        <div class="logo">cou<span style="text-decoration: none;">ri</span></div>
      </div>

      <section class="hero">
        <h1>You've been invited<br/>to a transaction</h1>
        <div class="sub">
          with <span class="inviter-name">User</span>
          <span class="avatar">
            <span class="avatar-initial">U</span>
          </span>
        </div>
      </section>

      <section class="card">
        <div class="item-info">
          <p class="title" id="item-title">"Loading..."</p>
        </div>
        <div class="thumb">
          <img id="item-image" src="" alt="Item thumbnail" style="display: none;"/>
        </div>
      </section>

      <div class="source">
        <span class="fb" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 12.06C22 6.504 17.523 2 12 2S2 6.504 2 12.06C2 17.083 5.657 21.246 10.438 22v-7.02H7.898v-2.92h2.54V9.846c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.196 2.238.196v2.48h-1.26c-1.242 0-1.63.776-1.63 1.572v1.885h2.774l-.443 2.92h-2.331V22C18.343 21.246 22 17.083 22 12.06z" fill="#1877F2"/>
          </svg>
        </span>
        <span class="source-text">from Facebook Marketplace</span>
      </div>

      <button class="btn" id="join-btn" onclick="handleJoinTransaction()">Join Transaction</button>
      <button class="decline" onclick="handleDecline()">Decline</button>
    </main>

    <footer class="footer">
      <div class="safety">
        <div class="badge" aria-hidden="true">
          <img src="https://nfkykasruwdzpcjuufdu.supabase.co/storage/v1/object/public/app-icons/Mark%202%20Dark.png" alt="Couri Logo" />
        </div>
        <div class="tag">SECURE PAYMENTS, SAFE PICKUP & DELIVERY</div>
      </div>
    </footer>
  </div>

  <script>
    const CONFIG = {
      SUPABASE_URL: 'https://nfkykasruwdzpcjuufdu.supabase.co',
      SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ma3lrYXNydXdkenBjanV1ZmR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTAxOTU5OTcsImV4cCI6MjA2NTc3MTk5N30._-SBo_yqk0ABeXNHYGsKjBn2HwrFP-QCjCkJn2KqtOw',
      APP_STORE_URL: 'https://apps.apple.com/app/couri/id6736088504'
    };
    
    let transactionData = null;
    let supabaseClient = null;

    function getTransactionId() {
      const urlParams = new URLSearchParams(window.location.search);
      const transactionId = urlParams.get('id') || urlParams.get('transaction_id') || urlParams.get('t');
      
      if (!transactionId) {
        const pathParts = window.location.pathname.split('/');
        const lastPart = pathParts[pathParts.length - 1];
        if (lastPart && lastPart !== 'invite' && lastPart !== 'auth-callback') {
          return lastPart;
        }
      }
      
      return transactionId;
    }

    async function loadTransaction() {
      try {
        const transactionId = getTransactionId();
        
        if (!transactionId) {
          document.querySelector('.hero h1').textContent = 'Invalid Link';
          document.querySelector('.sub').textContent = 'Please check your invitation link and try again.';
          document.querySelector('.card').style.display = 'none';
          document.querySelector('.source').style.display = 'none';
          document.querySelector('.btn').style.display = 'none';
          document.querySelector('.decline').style.display = 'none';
          return;
        }

        const { data: transactions, error } = await supabaseClient
          .from('transactions')
          .select('*')
          .eq('id', transactionId);

        if (error) {
          console.error('Error:', error);
          showLoadingError();
          return;
        }

        if (!transactions || transactions.length === 0) {
          showLoadingError();
          return;
        }

        const transaction = transactions[0];
        
        transactionData = {
          ...transaction,
          item_title: transaction.metadata?.item_title || transaction.metadata?.title || 'Untitled Item',
          item_image: transaction.metadata?.item_image || transaction.metadata?.image || null,
          source: transaction.metadata?.source || 'Facebook Marketplace'
        };
        
        const inviterName = transaction.metadata?.inviter_name || 
                           transaction.metadata?.userAddress?.full_name || 
                           transaction.metadata?.userAddress?.name || 
                           'User';

        displayTransaction(inviterName);
        
      } catch (error) {
        console.error('Error:', error);
        showLoadingError();
      }
    }

    function displayTransaction(inviterName) {
      if (!transactionData) return;

      document.querySelector('.inviter-name').textContent = inviterName;
      document.querySelector('.avatar-initial').textContent = inviterName.charAt(0).toUpperCase();
      
      const titleEl = document.getElementById('item-title');
      if (titleEl) {
        titleEl.textContent = `"${transactionData.item_title}"`;
      }
      
      const thumbImg = document.getElementById('item-image');
      if (thumbImg && transactionData.item_image) {
        thumbImg.src = transactionData.item_image;
        thumbImg.style.display = 'block';
        thumbImg.onerror = function() {
          this.style.display = 'none';
        };
      }

      const sourceText = document.querySelector('.source-text');
      if (sourceText) {
        sourceText.textContent = `from ${transactionData.source}`;
      }
    }

    function showLoadingError() {
      document.querySelector('.hero h1').textContent = 'Unable to Load';
      document.querySelector('.sub').textContent = 'The invitation link may be invalid or expired.';
      document.querySelector('.card').style.display = 'none';
      document.querySelector('.source').style.display = 'none';
      document.querySelector('.btn').style.display = 'none';
      document.querySelector('.decline').style.display = 'none';
    }

    function handleJoinTransaction() {
      const joinBtn = document.getElementById('join-btn');
      if (joinBtn) {
        joinBtn.disabled = true;
        joinBtn.textContent = 'Processing...';
      }
      
      const transactionId = getTransactionId();
      
      // Update transaction status to accepted
      if (transactionId && supabaseClient) {
        supabaseClient
          .from('transactions')
          .update({ status: 'accepted', updated_at: new Date().toISOString() })
          .eq('id', transactionId)
          .catch(err => console.error('Update error:', err));
      }
      
      // Redirect to success page (update this URL to match your hosting)
      const successUrl = `${window.location.origin}/web-accepted.html?id=${transactionId || ''}`;
      window.location.href = successUrl;
    }

    function handleDecline() {
      const transactionId = getTransactionId();
      if (transactionId && supabaseClient) {
        supabaseClient
          .from('transactions')
          .update({ status: 'declined', updated_at: new Date().toISOString() })
          .eq('id', transactionId)
          .catch(err => console.error('Update error:', err));
      }
      
      document.querySelector('.hero h1').textContent = 'Transaction Declined';
      document.querySelector('.sub').textContent = 'This transaction is closed.';
      document.querySelector('.card').style.display = 'none';
      document.querySelector('.source').style.display = 'none';
      document.querySelector('.btn').style.display = 'none';
      document.querySelector('.decline').style.display = 'none';
    }

    function init() {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      script.onload = () => {
        supabaseClient = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        loadTransaction();
      };
      script.onerror = () => {
        showLoadingError();
      };
      document.head.appendChild(script);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
